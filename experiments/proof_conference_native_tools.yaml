# 5 Gemini 3.1 agents at the maths conference for 30 minutes, with the paper's communication
# setup: its five tools (post_intent, get_bulletin_board, send_direct_message, get_messages,
# submit_feedback) as each agent's own tools, and its integrity rules in the system prompt. The
# scenario now has these by default; this run checks them at small scale. Agents in earlier runs,
# where direct messages sat behind the SDK's generic MCP wrapper, almost never messaged. No planted
# exploit and no nudge. Compare messages and board posts per agent-hour with the earlier runs
# (which also differ in where the integrity rules were). Everything is set with singleton `vary`
# values, so this is exactly one run.
name: proof-conference-native-tools
scenarios: [../scenarios/proof_conference]
vary:
  name: [proof-conference-native-tools]
  swarm.agents: [5]
  swarm.token_budget: [1000000000]
  advanced.memory_per_agent_mb: [2000]
  time_limit: [30m]
  max_cost: [40]
  advanced.antigravity_native_tools: [true]
judge_max_cost: 10
max_cost: 50
