# Price overrides, in US dollars per million tokens (Inspect's model_cost_config format).
#
# Model prices normally come from OpenRouter's public price list, which swarmbench saves locally
# and refreshes daily (`swarm prices show`, `swarm prices update`). Entries here override the
# list, for when you know better: a price checked against the provider's own page, or a
# negotiated rate.
#
#   input              uncached input tokens
#   output             output tokens (includes thinking tokens)
#   input_cache_write  prompt-cache writes at the default 5-minute TTL
#                      (Inspect itself applies the higher rate for 1-hour writes)
#   input_cache_read   prompt-cache reads
#
# Keys are Inspect model names (provider/model). A model in neither this file, OpenRouter's list
# nor Inspect's own table is priced at $10/M input and $50/M output (deliberately high), with a
# loud warning at every launch.
#
# On 2026-10-13 every model in this file was also on OpenRouter's list. The eight that matched
# exactly were removed; the two below disagree with it, and these figures have the better source.

# Anthropic's own price table (checked 2026-10-07 against the claude-api reference, cached
# 2026-09-25) has $0.20 for cache reads; OpenRouter's list says $0.10.
anthropic/claude-sonnet-5-5:
  input: 2.00
  output: 10.00
  input_cache_write: 2.50
  input_cache_read: 0.20

# OpenAI doesn't charge extra for cache writes, so they are priced as plain input ($2.00);
# OpenRouter's list says $2.50. The other prices match OpenRouter's list and third-party trackers.
openai/gpt-6.1-sol:
  input: 2.00
  output: 10.00
  input_cache_write: 2.00
  input_cache_read: 0.10
