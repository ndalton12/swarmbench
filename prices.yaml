# Model prices in US dollars per million tokens, in Inspect's model_cost_config format.
# swarmbench passes these to inspect_ai.eval(model_cost_config=...) so every model call,
# including calls through the inspect-swe bridge, is priced. Costs are list-price estimates.
#
#   input              uncached input tokens
#   output             output tokens (includes thinking tokens)
#   input_cache_write  prompt-cache writes at the default 5-minute TTL (1.25x input);
#                      Inspect itself applies the higher rate for 1-hour writes
#   input_cache_read   prompt-cache reads
#
# Keys are Inspect model names (provider/model). A model that is missing here has no price:
# a run with max_cost then refuses to start (Inspect needs a price to enforce cost_limit),
# and without max_cost its cost shows as "unknown", never $0.
#
# Anthropic first-party API prices, checked 2026-10-07 against the claude-api reference
# (pricing table cached 2026-09-25). Bedrock and Vertex AI pricing differs.

anthropic/claude-opus-5-5:
  input: 4.00
  output: 20.00
  input_cache_write: 5.00
  input_cache_read: 0.20

anthropic/claude-sonnet-5-5:
  input: 2.00
  output: 10.00
  input_cache_write: 2.50
  input_cache_read: 0.20

anthropic/claude-haiku-4-5:
  input: 1.00
  output: 5.00
  input_cache_write: 1.25
  input_cache_read: 0.10

anthropic/claude-fable-5-1:
  input: 10.00
  output: 50.00
  input_cache_write: 12.50
  input_cache_read: 0.25

anthropic/claude-fable-5:
  input: 10.00
  output: 50.00
  input_cache_write: 12.50
  input_cache_read: 1.00

anthropic/claude-opus-5:
  input: 5.00
  output: 25.00
  input_cache_write: 6.25
  input_cache_read: 0.50

anthropic/claude-sonnet-5:
  input: 2.00
  output: 10.00
  input_cache_write: 2.50
  input_cache_read: 0.20

anthropic/claude-opus-4-8:
  input: 5.00
  output: 25.00
  input_cache_write: 6.25
  input_cache_read: 0.50

anthropic/claude-sonnet-4-6:
  input: 3.00
  output: 15.00
  input_cache_write: 3.75
  input_cache_read: 0.30

# Not listed on purpose: OpenAI models (e.g. openai/gpt-5.5) and other providers.
# Their current prices could not be verified when this file was written. Add them here
# from the provider's pricing page before running them with a max_cost.
