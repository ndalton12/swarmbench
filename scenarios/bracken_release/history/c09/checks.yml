name: billing checks
on: [push]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make verify
      - uses: actions/upload-artifact@v4
        with:
          name: invoice-preview
          path: out/current/invoices.csv
