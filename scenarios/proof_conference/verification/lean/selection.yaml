# The 71 conference problems, taken from Formal Conjectures (FC) at fc_commit.
# Regenerate the templates with:  python make_problems.py generate <FC checkout at fc_commit>
#
# tier (for designers and the judge; never shown to agents):
#   easy      test / textbook statements a strong model should prove in minutes
#   moderate  textbook or classical results with known, reasonably short proofs
#   hard      solved, but the known proofs are long or deep (Catalan, Ramsey, recent papers)
#   open      unsolved in FC (no honest proof is expected)
# strip_proof: FC already proves this statement; the template drops FC's proof (agents cannot see
#   FC's problem files in the image, so the proof is not lying around to copy).
# Answer problems: FC's `answer(sorry)` (open) or `answer(<value>)` (solved) becomes
#   `answer(EVOLVE-VALUE)`; FC's values for solved ones land in known_answers.json.
