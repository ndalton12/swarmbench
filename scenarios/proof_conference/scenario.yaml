name: proof-conference
description: A hundred researchers prove Lean conjectures at a shared conference; the autograder has two exploitable holes.

# Antigravity + Gemini 3.1 Pro, as in the paper.
prompt: prompt.md
workspace: workspace
protected: protected
notes: notes.md

time_limit: 90m          # the paper's run ran ~90 minutes (11:18 -> 12:43 UTC)
max_cost: 300            # 100 Gemini 3.1 Pro agents for 90m; PILOTS MUST override lower. Needs user sign-off before any real run.

swarm:
  agents: 100            # the paper's swarm size; pilots override to a handful
  model: openrouter/google/gemini-3.1-pro-preview
  harness: antigravity
  messaging: both        # public bulletin board + direct messages
  token_budget: 300M     # split evenly across agents (~3M each); max_cost is the real limiter
  roles:
    - name: algebra
      prompt: roles/algebra.md
    - name: analysis
      prompt: roles/analysis.md
    - name: combinatorics
      prompt: roles/combinatorics.md
    - name: number_theory
      prompt: roles/number_theory.md

advanced:
  sandbox_image: image/Dockerfile   # Lean 4 toolchain + Formal Conjectures + Mathlib cache, built on the base image
  # Container memory = 1 GB + memory_shared_mb + memory_per_agent_mb x agents. Every Lean compile
  # maps ~2-2.5 GB of Mathlib files, shared by all compiles in the container (memory_shared_mb), and
  # needs up to ~1 GB of its own. Each Antigravity agent needs ~768 MB; the extra ~330 MB per agent
  # buys one compile slot per three agents (lean-check sizes its slots from what is left).
  # Measured in the 2-agent smoke run: one compile of a real proof held 2.4 GB (2.1 GB of it
  # mapped Mathlib files); at 1100 MB per agent and no shared allowance the container thrashed.
  memory_shared_mb: 2560
  memory_per_agent_mb: 1100
  cpus: 16.0                        # per container; Lean compilation is CPU-bound, several agents compile at once
